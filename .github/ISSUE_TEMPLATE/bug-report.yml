name: Bug Report
description: Report a bug or an issue with SlimeFrame
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for taking the time to report a bug!
        Please fill out the form below as accurately as possible. Detailed reports get fixed much faster.

        <strong><i>Fields marked with an asterisk (*) are required.</i></strong>

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following before submitting.
      options:
        - label: I am using the latest version of SlimeFrame.
          required: true
        - label: I have not modified the plugin JAR in any way.
          required: true
        - label: I have searched the [existing issues](https://github.com/mybezo/SlimeFrame/issues) and could not find the same problem.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe the issue in as much detail as possible.
      placeholder: '"It doesn''t work" is not enough for us to find the problem.'
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Explain exactly how to reproduce the issue.
        Screenshots or a video link are very welcome.
      placeholder: |
        1. Place a ...
        2. Right-click with ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: server-log
    attributes:
      label: Server log
      description: |
        If your server log contains errors, upload it to [mclo.gs](https://mclo.gs) and paste the link here.
        **Please do not paste the log directly into this field.**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: input
    id: error-report
    attributes:
      label: Error report
      description: |
        If the log mentions a file in `/plugins/Slimefun/error-reports`, upload it to [mclo.gs](https://mclo.gs) and paste the link here.
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run `/sf versions` in game and paste the **full output** (or a screenshot) here.
        If the command does not work, list your server software, Minecraft version, Slimefun version, SlimeFrame version and installed plugins manually.
        "latest" is not a version number.
      placeholder: Paste the output of /sf versions here
    validations:
      required: true
